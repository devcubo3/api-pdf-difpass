name: Premium API and legacy compatibility
on:
  push:
    paths:
      - 'premium/**'
      - '.github/workflows/premium.yml'
  pull_request:
    paths:
      - 'premium/**'
      - '.github/workflows/premium.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    # Ubuntu 24.04 restricts unprivileged user namespaces for downloaded browsers.
    # Use a compatible runner while keeping Chromium's sandbox enabled.
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: difftravel_test
          POSTGRES_USER: difftravel_test
          POSTGRES_PASSWORD: ci-only-not-production
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U difftravel_test" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      PDF_TEST_DATABASE_URL: postgresql+psycopg://difftravel_test:ci-only-not-production@localhost:5432/difftravel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-por tesseract-ocr-eng
      - run: python -m pip install -r premium/requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Check sandboxed browser startup
        run: python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(chromium_sandbox=True); b.close(); p.stop()"
      - run: python -m pytest -q --junitxml=var/test-results/ci.xml
        working-directory: premium
      - run: python scripts/smoke_canonical_http.py --browser-channel chromium
        working-directory: premium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-tests
          path: premium/var/test-results/*.xml
  deployment-image:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate premium compose
        run: docker compose -f premium/docker-compose.yml -f premium/docker-compose.dokploy.yml config --quiet
        env:
          DATABASE_URL: postgresql+psycopg://difftravel_premium:ci-only@db:5432/difftravel_premium
          POSTGRES_PASSWORD: ci-only
          PDF_API_TOKENS: '{}'
          OPENAI_API_KEY: synthetic-no-provider-access
      - run: docker build -t difftravel-premium:ci premium
      - name: Exercise sandboxed Chromium inside deployment image
        run: |
          docker compose -f premium/docker-compose.yml run --rm --no-deps --entrypoint python worker -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(chromium_sandbox=True); page=b.new_page(); page.set_content('<p>SYNTHETIC CONTAINER TEST</p>'); assert page.pdf().startswith(b'%PDF-'); b.close(); p.stop(); print('Sandboxed PDF renderer passed')"
        env:
          PDF_IMAGE_REF: difftravel-premium:ci
          DATABASE_URL: postgresql+psycopg://difftravel_premium:ci-only@db:5432/difftravel_premium
          POSTGRES_PASSWORD: ci-only
          PDF_API_TOKENS: '{}'
          OPENAI_API_KEY: synthetic-no-provider-access
  legacy-compatibility:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify legacy dependencies and HTTP contract
        # The legacy service retains its Python 3.11 runtime.
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run legacy HTTP regression
        run: |
          python -m venv /tmp/difftravel-legacy-ci
          /tmp/difftravel-legacy-ci/bin/python -m pip install -r requirements.txt httpx 'reportlab<5'
          /tmp/difftravel-legacy-ci/bin/python -m uvicorn api_pdf:app --host 127.0.0.1 --port 8099 --no-access-log > /tmp/difftravel-legacy-ci.log 2>&1 &
          legacy_pid=$!
          trap 'kill "$legacy_pid" 2>/dev/null || true' EXIT
          /tmp/difftravel-legacy-ci/bin/python premium/scripts/smoke_legacy_http.py --base-url http://127.0.0.1:8099
  shared-service:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r premium/requirements-dev.txt
      - run: docker build -f premium/Dockerfile.shared -t difftravel-shared:ci .
      - name: Exercise both APIs, worker recovery and persisted restart in one service
        run: python scripts/smoke_canonical_http.py --shared-image difftravel-shared:ci --browser-channel chromium
        working-directory: premium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-service-test-report
          path: |
            premium/var/test-results/canonical-http-*/report.json
            premium/var/test-results/canonical-http-*/*.log

  portable-renderer:
    runs-on: ubuntu-24.04
    env:
      PDF_TEST_HTML_ENGINE: weasyprint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-por tesseract-ocr-eng libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: python -m pip install -r premium/requirements-dev.txt
      - name: Verify portable layout, pagination, original codes and download link
        run: python -m pytest tests/test_html_template.py tests/test_canonical.py tests/test_weasy_engine.py tests/test_shared_service.py tests/test_auto_release.py tests/test_validation_regressions.py -q --junitxml=var/test-results/portable.xml
        working-directory: premium
      - run: docker build -f premium/Dockerfile.shared -t difftravel-portable:ci .
      - name: Exercise both APIs with default Docker seccomp and no elevated capabilities
        run: python scripts/smoke_canonical_http.py --shared-image difftravel-portable:ci --html-engine weasyprint
        working-directory: premium
      - name: Verify automatic delivery and safety download in the shared portable runtime
        run: python scripts/smoke_canonical_http.py --shared-image difftravel-portable:ci --html-engine weasyprint --review-policy validated_auto
        working-directory: premium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-renderer-test-report
          path: |
            premium/var/test-results/portable.xml
            premium/var/test-results/canonical-http-*/report.json
            premium/var/test-results/canonical-http-*/*.log
